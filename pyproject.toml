[project]
name = "ltd"
version = "0.1.0"
description = "The Language of Thought Is a Design Choice — unifying demonstration (LP4FM @ NeurIPS 2026)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "datasets>=2.19",
    "huggingface-hub>=0.24",
    "transformers>=4.51",
    "tokenizers>=0.21",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "regex>=2024.4",
    "py3langid>=0.3",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Installed on the GPU box. vLLM is Linux-only; torch comes in as its dependency
# with the right CUDA build, so we do not pin torch here.
gpu = [
    "vllm>=0.8.5 ; sys_platform == 'linux'",
    "hf-transfer>=0.1.6",
]
# Local (macOS/CPU) development + dry runs: transformers backend only.
dev = [
    "torch>=2.2",
    "accelerate>=0.30",
]

[project.scripts]
ltd = "ltd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ltd"]
